<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>URL Checker</title>
<style>
:root{
  --ink:#16191d; --ink-2:#3d444d; --ink-3:#6b737d;
  --paper:#f7f6f3; --surface:#ffffff; --rule:#dcd9d2;
  --live:#1f6f43; --live-bg:#e3f2e8;
  --dead:#8a2d2d; --dead-bg:#f8e6e4;
  --warn:#8a6116; --warn-bg:#faf0d9;
  --idle:#5a6068; --idle-bg:#eceae5;
  --focus:#2a5fb8;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans)}
.wrap{max-width:1500px;margin:0 auto;padding:28px 24px 80px}

header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;
  gap:10px 24px;padding-bottom:14px;border-bottom:2px solid var(--ink)}
.mark{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{height:42px;width:auto;display:block}
h1{font-size:19px;font-weight:650;letter-spacing:-.01em;margin:0}
.org{margin:0;font-size:13.5px;color:var(--ink-2);font-weight:500;
  padding-left:12px;border-left:1px solid var(--rule)}
.tag{margin:0;color:var(--ink-3);font-size:13px}
@media(max-width:620px){.org{padding-left:0;border-left:none;width:100%}}

/* ---- drop zone ---- */
.drop{margin-top:22px;border:1.5px dashed var(--rule);background:var(--surface);
  padding:36px 24px;text-align:center;cursor:pointer;transition:border-color .12s,background .12s}
.drop:hover,.drop:focus-visible{border-color:var(--ink-2);outline:none}
.drop.over{border-color:var(--focus);border-style:solid;background:#eef3fc}
.drop strong{display:block;font-size:16px;font-weight:600;margin-bottom:5px}
.drop span{color:var(--ink-3);font-size:13px}
.drop.loaded{border-style:solid;border-color:var(--ink-2);padding:18px 24px;text-align:left}
#fileinput{display:none}

/* ---- controls ---- */
.controls{display:flex;flex-wrap:wrap;gap:26px;align-items:flex-end;
  margin-top:20px;padding:16px 18px;background:var(--surface);border:1px solid var(--rule)}
.opt{display:flex;flex-direction:column;gap:5px}
.opt label{font-size:13px;color:var(--ink-2)}
.opt .hint{font-size:11.5px;color:var(--ink-3);max-width:34ch}
.check{flex-direction:row;align-items:flex-start;gap:9px;max-width:32ch}
.check input{margin-top:3px;width:15px;height:15px;accent-color:var(--focus)}
input[type=number]{font:14px var(--sans);padding:6px 8px;border:1px solid var(--rule);
  background:#fff;color:var(--ink)}
button{font:14px/1 var(--sans);font-weight:600;padding:11px 20px;border:1px solid var(--ink);
  background:var(--ink);color:#fff;cursor:pointer}
button:hover:not(:disabled){background:var(--ink-2);border-color:var(--ink-2)}
button:disabled{opacity:.4;cursor:not-allowed}
button.ghost{background:transparent;color:var(--ink);font-weight:500;padding:8px 14px}
button.ghost:hover:not(:disabled){background:var(--idle-bg)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* ---- status line ---- */
#status{margin-top:16px;font-size:13.5px;min-height:20px;color:var(--ink-2)}
#status.err{color:var(--dead);font-weight:500}
.bar{height:2px;background:var(--rule);margin-top:10px;overflow:hidden;display:none}
.bar.on{display:block}
.bar i{display:block;height:100%;width:35%;background:var(--focus);animation:slide 1.1s linear infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(400%)}}
@media (prefers-reduced-motion:reduce){.bar i{animation:none;width:100%;opacity:.5}}

/* ---- summary ---- */
.tally{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.tally button{border:1px solid var(--rule);background:var(--surface);color:var(--ink-2);
  font-weight:500;padding:7px 13px;font-size:13px}
.tally button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tally b{font-variant-numeric:tabular-nums}

/* ---- table ---- */
.tablewrap{margin-top:14px;overflow-x:auto;border:1px solid var(--rule);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:600;color:var(--ink-2);padding:9px 12px;
  border-bottom:1.5px solid var(--ink-2);white-space:nowrap;position:sticky;top:0;background:var(--surface)}
td{padding:9px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
tr:last-child td{border-bottom:none}
td.u{font-family:var(--mono);font-size:12px;word-break:break-all;max-width:430px;line-height:1.45}
td.n{font-variant-numeric:tabular-nums;color:var(--ink-3);width:44px}
.badge{display:inline-block;padding:2px 8px;font-size:11.5px;font-weight:600;white-space:nowrap}
.b-live{background:var(--live-bg);color:var(--live)}
.b-dead{background:var(--dead-bg);color:var(--dead)}
.b-warn{background:var(--warn-bg);color:var(--warn)}
.b-idle{background:var(--idle-bg);color:var(--idle)}
.chain{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);word-break:break-all;max-width:330px}
.hops{font-weight:600;color:var(--warn)}
.muted{color:var(--ink-3)}
.exports{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="mark">
    <img src="/static/logo.png" alt="Cyber Alert" class="logo"
         onerror="this.style.display='none'">
    <h1>URL Checker</h1>
    <p class="org">Διεύθυνση Δίωξης Κυβερνοεγκλήματος</p>
  </div>
  <p class="tag">Ελέγχει καταγγελλόμενους συνδέσμους από αρχείο Excel</p>
</header>

<div class="drop" id="drop" tabindex="0" role="button" aria-label="Επιλογή αρχείου Excel">
  <strong id="dropTitle">Αφήστε εδώ το αρχείο .xlsx</strong>
  <span id="dropSub">ή πατήστε για επιλογή</span>
</div>
<input type="file" id="fileinput" accept=".xlsx,.xlsm,.xls">

<div class="controls">
  <div class="opt check">
    <input type="checkbox" id="check" checked>
    <div>
      <label for="check">Άμεσος έλεγχος</label>
      <div class="hint">Το αίτημα φεύγει από τη δική σας σύνδεση.</div>
    </div>
  </div>

  <div class="opt check">
    <input type="checkbox" id="scan" checked>
    <div>
      <label for="scan">Ανίχνευση ανακατευθύνσεων</label>
      <div class="hint">Μέσω redirectcheck.org. Δεν εντοπίζει ανακατευθύνσεις μέσω JavaScript.</div>
    </div>
  </div>

  <div class="opt">
    <label for="maxrows">Γραμμές</label>
    <input type="number" id="maxrows" value="1000" min="1" max="10000" style="width:96px">
  </div>

  <button id="run" disabled>Έλεγχος</button>
</div>

<div id="status"></div>
<div class="bar" id="bar"><i></i></div>

<div id="results" hidden>
  <div class="tally" id="tally"></div>
  <div class="tablewrap"><table id="table"><thead></thead><tbody></tbody></table></div>
  <div class="exports">
    <button id="xlsx">Λήψη Excel</button>
    <button class="ghost" id="csv">Λήψη CSV</button>
    <button class="ghost" id="json">Λήψη JSON</button>
  </div>
</div>

</div>
<script>
const $ = s => document.querySelector(s);
const drop=$('#drop'), fi=$('#fileinput'), run=$('#run'), statusEl=$('#status'), bar=$('#bar');
let file=null, rows=[], filter=null, raw=null;

const URLCOL   = 'URL ή ΙΡ ΚΑΤΑΓΓΕΛΛΟΜΕΝΟΥ ΙΣΤΟΤΟΠΟY';
const REDIRCOL = 'URL ή ΙΡ ΑΝΑΚΑΤΕΥΘΥΝΣΗΣ';
const BRANDCOL = 'ΜΙΜΟΥΜΕΝΟΣ ΙΣΤΟΤΟΠΟΣ';
const TYPECOL  = 'ΕΙΔΟΣ ΑΠΕΙΛΗΣ /ΗΛΕΚΤΡΟΝΙΚΗΣ ΑΠΑΤΗΣ - ΠΑΡΑΠΛΑΝΗΣΗΣ';

/* --- επιλογή αρχείου --- */
drop.onclick = () => fi.click();
drop.onkeydown = e => { if(e.key==='Enter'||e.key===' '){e.preventDefault();fi.click();} };
['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over')}));
drop.addEventListener('drop',e=>setFile(e.dataTransfer.files[0]));
fi.onchange = () => setFile(fi.files[0]);

function setFile(f){
  if(!f) return;
  if(!/\.(xlsx|xlsm|xls)$/i.test(f.name)){ say('Δεκτά μόνο αρχεία Excel (.xlsx, .xlsm, .xls).',true); return; }
  file=f; run.disabled=false; drop.classList.add('loaded');
  $('#dropTitle').textContent = f.name;
  $('#dropSub').textContent = (f.size/1024).toFixed(0)+' KB · πατήστε για αλλαγή';
  say('');
}
function say(m,err){ statusEl.textContent=m; statusEl.className = err?'err':''; }

function params(){
  return new URLSearchParams({
    check: $('#check').checked,
    scan: $('#scan').checked,
    max_rows: $('#maxrows').value
  });
}

/* --- εκτέλεση --- */
run.onclick = async () => {
  const fd = new FormData(); fd.append('file', file);
  run.disabled=true; bar.classList.add('on');
  say('Έλεγχος συνδέσμων…');
  const t0 = Date.now();
  try{
    const r = await fetch('/upload?'+params(), {method:'POST', body:fd});
    const body = await r.json();
    if(!r.ok) throw new Error(body.detail || r.status);
    raw = body;
    const sheet = Object.values(body.sheets)[0];
    rows = sheet.data; filter = null;
    render();
    say(`${rows.length} γραμμές · ${((Date.now()-t0)/1000).toFixed(1)} δλ`);
  }catch(err){
    say('Ο έλεγχος απέτυχε: '+err.message, true);
  }finally{
    run.disabled=false; bar.classList.remove('on');
  }
};

/* --- κατάσταση --- */
function stateOf(r){
  const k = Object.keys(r).find(k=>k.startsWith(URLCOL) && k.endsWith(':: STATE'));
  return k ? r[k] : null;
}
function cls(s){
  if(!s) return 'b-idle';
  if(s==='ACTIVE') return 'b-live';
  if(/REDIRECT|TIMEOUT|FORBIDDEN|SSL|HTTP/.test(s)) return 'b-warn';
  return 'b-dead';
}

function render(){
  $('#results').hidden = false;

  /* σύνοψη + φίλτρα */
  const counts = {};
  rows.forEach(r=>{ const s = stateOf(r) || '—'; counts[s]=(counts[s]||0)+1; });
  const t = $('#tally'); t.innerHTML='';
  const all = document.createElement('button');
  all.innerHTML = `Όλα <b>${rows.length}</b>`;
  all.setAttribute('aria-pressed', filter===null);
  all.onclick = () => { filter=null; render(); };
  t.appendChild(all);
  Object.entries(counts).sort((a,b)=>b[1]-a[1]).forEach(([s,n])=>{
    const b=document.createElement('button');
    b.innerHTML = `${esc(s)} <b>${n}</b>`;
    b.setAttribute('aria-pressed', filter===s);
    b.onclick = () => { filter = filter===s?null:s; render(); };
    t.appendChild(b);
  });

  /* πίνακας */
  const shown = filter===null ? rows : rows.filter(r=>(stateOf(r)||'—')===filter);
  const hasRedir = rows.some(r=>'REDIRECTED' in r);
  const head = ['Γρ.','Σύνδεσμος','Κατάσταση','Κωδ.']
    .concat(hasRedir ? ['Ανακατεύθυνση','Hops'] : [])
    .concat(['Μιμούμενος','Είδος']);

  $('#table thead').innerHTML = '<tr>'+head.map(h=>`<th>${esc(h)}</th>`).join('')+'</tr>';

  $('#table tbody').innerHTML = shown.map(r=>{
    const st    = stateOf(r);
    const code  = r[`${URLCOL} :: CODE`];
    const chain = r['REDIRECT CHAIN'];
    const final = r['FINAL URL'] || r[`${URLCOL} :: FINAL`];
    const src   = r[URLCOL];
    const hops  = r['REDIRECT HOPS'];
    const line  = rows.indexOf(r) + 2;   // γραμμή στο Excel

    let redir = '<span class="muted">—</span>';
    if(chain)                      redir = `<div class="chain">${esc(chain)}</div>`;
    else if(final && final!==src)  redir = `<div class="chain">${esc(final)}</div>`;
    else if(r[REDIRCOL])           redir = `<div class="chain muted">${esc(r[REDIRCOL])}</div>`;

    return '<tr>'
      + `<td class="n">${line}</td>`
      + `<td class="u">${src ? esc(src) : '<span class="muted">κενό</span>'}</td>`
      + `<td><span class="badge ${cls(st)}">${esc(st||'—')}</span></td>`
      + `<td class="n">${code ?? ''}</td>`
      + (hasRedir
          ? `<td>${redir}</td><td class="n${hops?' hops':''}">${hops || ''}</td>`
          : '')
      + `<td>${esc(r[BRANDCOL]||'')}</td>`
      + `<td class="muted">${esc((r[TYPECOL]||'').slice(0,48))}</td>`
      + '</tr>';
  }).join('');
}

function esc(s){ return String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* --- λήψεις --- */
$('#xlsx').onclick = async () => {
  const fd = new FormData(); fd.append('file', file);
  const btn = $('#xlsx'); btn.disabled=true; bar.classList.add('on');
  say('Δημιουργία αρχείου Excel…');
  try{
    const r = await fetch('/upload/xlsx?'+params(), {method:'POST', body:fd});
    if(!r.ok) throw new Error((await r.json()).detail || r.status);
    dl(await r.blob(), 'excel_προς_ΕΑΚ.xlsx');
    say('Το αρχείο κατέβηκε.');
  }catch(err){ say('Η λήψη απέτυχε: '+err.message, true); }
  finally{ btn.disabled=false; bar.classList.remove('on'); }
};

$('#csv').onclick = () => {
  const keys = [...new Set(rows.flatMap(Object.keys))];
  const q = v => `"${String(v??'').replace(/"/g,'""')}"`;
  const csv = '\uFEFF' + [keys.map(q).join(',')]
    .concat(rows.map(r=>keys.map(k=>q(r[k])).join(','))).join('\r\n');
  dl(new Blob([csv],{type:'text/csv;charset=utf-8'}), 'url_checker.csv');
};

$('#json').onclick = () =>
  dl(new Blob([JSON.stringify(raw,null,2)],{type:'application/json'}), 'url_checker.json');

function dl(blob,name){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
</script>
</body>
</html>
